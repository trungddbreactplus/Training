services:
  search-app:
    build:
      context: ..
      dockerfile: ../Dockerfile
    container_name: search_product_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Neu muon override bien env truc tiep o day (optional)
      # URL_QDRANT: ${URL_QDRANT}
      # API_QDRANT: ${API_QDRANT}
      # COHERE_API_KEY: ${COHERE_API_KEY}
      # Cache model BGE-M3 vao volume de khong phai download lai moi lan rebuild
      HF_HOME: /app/.cache/huggingface
    volumes:
      # Cache Hugging Face model (BGE-M3 ~2.2GB) - quan trong de tranh re-download
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    # Uncomment neu may co GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  hf_cache:
    driver: local